<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#2dd4bf" stroke-width="1.6"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#60a5fa" stroke-width="1.4"/></marker>
    <style>.box{fill:#141c28;stroke:#2b3850}.t{fill:#eaf0f8;font-size:15px;font-weight:700;text-anchor:middle}.s{fill:#9db0c7;font-size:12px;text-anchor:middle}.m{fill:#6b7d94;font-size:11px;text-anchor:middle}.n{fill:#9db0c7;font-size:12px;text-anchor:middle}</style>
  </defs>
  <rect width="860" height="250" fill="#0b0f14" rx="16"/>
  <text x="430" y="30" class="t">ESP32-S3 Security Key — Authentication Flow</text>
  <rect x="15" y="60" width="185" height="120" rx="12" class="box"/>
  <text x="107" y="92" class="t">Browser</text>
  <text x="107" y="114" class="s">WebAuthn API</text>
  <text x="107" y="134" class="s">create() / get()</text>
  <text x="107" y="160" class="m">navigator.credentials</text>
  <rect x="230" y="60" width="185" height="120" rx="12" class="box"/>
  <text x="322" y="92" class="t">Operating System</text>
  <text x="322" y="114" class="s">CTAPHID over USB HID</text>
  <text x="322" y="134" class="s">generic HID driver</text>
  <text x="322" y="160" class="m">no vendor driver</text>
  <rect x="445" y="60" width="185" height="120" rx="12" class="box"/>
  <text x="537" y="92" class="t">ESP32-S3 + pico-fido</text>
  <text x="537" y="114" class="s">CTAP2 / U2F</text>
  <text x="537" y="134" class="s">USB native (OTG)</text>
  <text x="537" y="160" class="m">signs inside the chip</text>
  <rect x="660" y="60" width="185" height="120" rx="12" class="box"/>
  <text x="752" y="92" class="t">User</text>
  <text x="752" y="114" class="s">press BOOT button</text>
  <text x="752" y="134" class="s">User Presence</text>
  <text x="752" y="160" class="m">LED: green to blue</text>
  <line x1="200" y1="105" x2="228" y2="105" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="415" y1="105" x2="443" y2="105" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="630" y1="105" x2="658" y2="105" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="228" y1="150" x2="200" y2="150" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arb)"/>
  <line x1="443" y1="150" x2="415" y2="150" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arb)"/>
  <text x="322" y="215" class="n">Private key never leaves the chip · credentials bound to the registered domain (anti-phishing)</text>
</svg>

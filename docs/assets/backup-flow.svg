<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="4" refY="8" orient="auto"><path d="M0,0 L4,8 L8,0" fill="none" stroke="#2dd4bf" stroke-width="1.6"/></marker>
    <style>.box{fill:#141c28;stroke:#2b3850}.top{fill:#0e2b28;stroke:#2b7f75}.t{fill:#eaf0f8;font-size:14px;font-weight:700;text-anchor:middle}.s{fill:#9db0c7;font-size:11.5px;text-anchor:middle}.n{fill:#9db0c7;font-size:12px;text-anchor:middle}</style>
  </defs>
  <rect width="860" height="300" fill="#0b0f14" rx="16"/>
  <text x="430" y="28" class="t">Backup &amp; Recovery — One Secret, Three Roads</text>
  <rect x="330" y="45" width="200" height="60" rx="12" class="top"/>
  <text x="430" y="70" class="t">Secret S</text>
  <text x="430" y="90" class="s">recovery bytes</text>
  <rect x="20" y="150" width="250" height="105" rx="12" class="box"/>
  <text x="145" y="176" class="t">24 words (BIP-39)</text>
  <text x="145" y="198" class="s">mnemonic.py</text>
  <text x="145" y="218" class="s">write on paper / steel</text>
  <text x="145" y="238" class="s">last-resort recovery</text>
  <rect x="305" y="150" width="250" height="105" rx="12" class="box"/>
  <text x="430" y="176" class="t">Shamir shares (K-of-N)</text>
  <text x="430" y="198" class="s">split_secret.py</text>
  <text x="430" y="218" class="s">5 shares, any 3 recover</text>
  <text x="430" y="238" class="s">separate USB drives</text>
  <rect x="590" y="150" width="250" height="105" rx="12" class="box"/>
  <text x="715" y="176" class="t">Vault (AES-256-GCM)</text>
  <text x="715" y="198" class="s">vault.py</text>
  <text x="715" y="218" class="s">encrypted file, PBKDF2 key</text>
  <text x="715" y="238" class="s">keep anywhere incl. cloud</text>
  <line x1="380" y1="105" x2="180" y2="148" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="105" x2="430" y2="148" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="480" y1="105" x2="680" y2="148" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="430" y="282" class="n">Lose every device but keep the words: still recoverable · drill every 6 months</text>
</svg>
